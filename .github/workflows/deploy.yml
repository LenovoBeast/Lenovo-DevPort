name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Assemble site
        # Publish only the files the site needs. Uploading '.' used to expose
        # README.md, DESIGN_SYSTEM.md and the 940 KB source artwork publicly.
        run: |
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml LICENSE _site/
          cp -r fonts _site/
          cp lenovo-beast-128.png lenovo-beast-512.png lenovo-beast-512.webp \
             favicon-32.png favicon-48.png apple-touch-icon.png _site/
          touch _site/.nojekyll
          echo "Publishing:"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
